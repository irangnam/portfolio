<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEIA — Try it live · Irang Nam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="css/style.css?v=1794769588">
<style>
  html,body{height:100%}
  body{overflow:hidden;background:var(--bg)}
  #stage3d{position:fixed;inset:0}
  #stage3d canvas{width:100%;height:100%;display:block}
  .dock{position:fixed;left:var(--pad);bottom:var(--pad);z-index:5;width:min(300px,calc(100vw - 40px));display:flex;flex-direction:column;gap:10px}
  .pane{background:rgba(18,18,20,.78);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:var(--r)}
  /* now-playing card, shown only while she dances */
  #player{padding:12px;display:none;gap:12px;align-items:center}
  body.dancing #player{display:flex;animation:rise .45s cubic-bezier(.2,.8,.2,1)}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}}
  .art{flex:none;width:46px;height:46px;border-radius:8px;background:linear-gradient(135deg,var(--pink),#7a1f4d);display:grid;place-items:center}
  .eq{display:flex;gap:3px;align-items:flex-end;height:16px}
  .eq i{width:3px;background:#0a0a0b;border-radius:2px;animation:eq .9s ease-in-out infinite}
  .eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
  body.paused .eq i{animation-play-state:paused}
  @keyframes eq{0%,100%{height:4px}50%{height:16px}}
  .trk{flex:1;min-width:0}
  .trk b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trk>span{display:block;font-size:12px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prog{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:10px;color:var(--soft);font-variant-numeric:tabular-nums}
  .prog div{flex:1;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
  .prog div i{display:block;height:100%;width:0;background:var(--pink)}
  #pl-toggle{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center}
  #pl-toggle:hover{background:var(--pink)}
  #pl-toggle svg{width:14px;height:14px;fill:currentColor}
  #dance{grid-column:1/-1}
  body.embed .nav{display:none}body.embed .dock{left:16px;bottom:16px;width:min(270px,calc(100vw - 32px))}body.embed #cam{right:16px;bottom:16px;width:140px}
  /* controls */
  .ctrl{padding:14px;display:flex;flex-direction:column;gap:10px}
  .ctrl h1{font-family:var(--disp);font-weight:500;font-size:15px;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:baseline}
  .ctrl h1 small{font-family:var(--body);font-weight:400;font-size:12px;color:var(--soft)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .ctrl .btn{justify-content:center;padding:10px 12px}
  .ctrl .btn.main{background:var(--pink);border-color:var(--pink);color:#000}.ctrl .btn.main:hover{background:var(--ink);border-color:var(--ink)}
  .ctrl .btn[disabled]{opacity:.4;cursor:default}
  .opts{display:none;gap:14px;font-size:12px;color:var(--soft)}.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}.opts input{accent-color:var(--pink)}
  body.cam-on .opts{display:flex}
  .note{font-size:12px;line-height:1.5;color:var(--soft);word-break:keep-all}
  #status:empty{display:none}
  #bar{height:2px;background:var(--line)}#bar i{display:block;height:100%;width:0;background:var(--pink);transition:width .2s}
  body.loaded #bar{display:none}
  #cam{position:fixed;right:var(--pad);bottom:var(--pad);width:180px;aspect-ratio:4/3;object-fit:cover;transform:scaleX(-1);border-radius:var(--r);border:1px solid var(--line);z-index:5;background:#000}
  @media (max-width:820px){#cam{width:96px;bottom:auto;top:66px}}
</style>


<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
  "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.3.3/lib/three-vrm.module.min.js"
} }
</script>
</head>
<body>
<header class="nav">
  <a class="logo" href="index.html">Irang Nam</a>
  <span class="status"><i></i>SEIA — live demo</span>
  <nav><a href="index.html#/work/seia">← Back to project</a></nav>
</header>
<div id="stage3d"></div>
<div class="dock">
  <div id="player" class="pane" aria-live="polite">
    <div class="art" aria-hidden="true"><div class="eq"><i></i><i></i><i></i></div></div>
    <div class="trk">
      <b>HEART CRUSH!</b><span>IRISÉ (아이리제) · 안무 모션</span>
      <div class="prog"><span id="pl-now">0:00</span><div><i id="pl-bar"></i></div><span id="pl-len">0:00</span></div>
    </div>
    <button id="pl-toggle" aria-label="Pause dance"><svg viewBox="0 0 16 16"><path d="M3 2h4v12H3zM9 2h4v12H9z"/></svg></button>
  </div>
  <div class="ctrl pane">
    <h1>SEIA <small>drag to turn</small></h1>
    <div id="bar"><i></i></div>
    <div class="row">
      <button id="go" class="btn" disabled>Loading…</button>
      <button data-expr="wink" class="btn" data-needs-vrm disabled>Wink</button>
      <button id="dance" class="btn main" data-needs-vrm disabled>Dance</button>
    </div>
    <div class="opts">
      <label><input type="checkbox" id="showcam" checked> Show camera</label>
      <label><input type="checkbox" id="arms" checked> Track arms &amp; hands</label>
    </div>
    <p class="note">카메라를 켜면 표정과 고개, 팔을 따라 합니다. 영상은 브라우저 안에서만 처리됩니다.</p>
    <p id="status" class="note" role="status"></p>
  </div>
</div>
<video id="cam" playsinline muted hidden></video>
<script>if (/[?&]embed=1/.test(location.search)) document.body.classList.add("embed");</script>
<script type="module" src="js/seia-live.js?v=1794780183"></script>
</body>
</html>
